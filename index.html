<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peace - Para kay Maee</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at center, #140c1c 0%, #050508 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            overflow: hidden;
        }
        .header {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
        }
        
        /* Welcome Screen (Bonga & Clean) */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 30px;
            animation: fadeIn 1s ease-in-out;
        }
        .apology-text {
            font-size: 36px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 25px rgba(255, 30, 66, 0.4);
        }
        .click-btn {
            background: linear-gradient(135deg, #ff1e42 0%, #b3002d 100%);
            border: none;
            padding: 16px 45px;
            border-radius: 50px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 10px 35px rgba(255, 30, 66, 0.5);
            transition: all 0.3s ease;
        }
        .click-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 45px rgba(255, 30, 66, 0.7);
        }

        /* Cinematic Karaoke Screen */
        .main-content {
            flex: 1;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            max-width: 750px;
            width: 100%;
            position: relative;
        }

        .lyric-line {
            font-size: 30px;
            font-weight: 700;
            line-height: 1.5;
            letter-spacing: 1px;
            opacity: 0.15;
            transform: scale(0.95);
            transition: opacity 0.4s ease, transform 0.4s ease;
            position: absolute;
            width: 100%;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2px;
        }

        .lyric-line.active-line {
            opacity: 1;
            transform: scale(1.02);
        }

        /* Individual Character Styling for Red Karaoke Fill */
        .char {
            color: rgba(255, 255, 255, 0.25);
            transition: color 0.1s ease, text-shadow 0.1s ease;
        }

        .char.highlighted {
            color: #ff1e42; /* Makinang na pulang-pula */
            text-shadow: 0 0 18px rgba(255, 30, 66, 0.9), 0 0 35px rgba(255, 30, 66, 0.5);
        }

        .footer {
            text-align: center;
            padding-bottom: 10px;
        }
        .status {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1.5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">PAMBAWI LANGG</div>
    
    <!-- Welcome Screen -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="apology-text">Sorry na, Maee</div>
        <button class="click-btn" id="clickItBtn">Play Music ✨</button>
    </div>

    <!-- Cinematic Karaoke Lyrics Screen -->
    <div class="main-content" id="mainContent">
        <!-- Linya 1 -->
        <div class="lyric-line" data-start="0.4" data-end="4.3">And the light disappears</div>
        <!-- Linya 2 -->
        <div class="lyric-line" data-start="4.5" data-end="8.8">And when this world's insincere</div>
        <!-- Linya 3 -->
        <div class="lyric-line" data-start="9.0" data-end="13.1">You'll be safe here</div>
        <!-- Linya 4 -->
        <div class="lyric-line" data-start="13.3" data-end="17.9">When nobody is here screaming</div>
        <!-- Linya 5 -->
        <div class="lyric-line" data-start="18.1" data-end="23.0">I'll scream with you</div>
    </div>

    <div class="footer">
        <div class="status" id="audioStatus">You'll be Safe Here - Adie</div>
    </div>

    <audio id="audioPlayer" src="song.mp3" loop></audio>

    <script>
        const clickItBtn = document.getElementById('clickItBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const mainContent = document.getElementById('mainContent');
        const audioPlayer = document.getElementById('audioPlayer');
        const lyricLines = document.querySelectorAll('.lyric-line');

        // Awtomatikong i-wrap ang bawat letra sa span para sa letter-by-letter red highlight
        lyricLines.forEach(line => {
            const text = line.textContent;
            line.innerHTML = '';
            for (let char of text) {
                const span = document.createElement('span');
                span.className = 'char';
                span.textContent = char;
                line.appendChild(span);
            }
        });

        clickItBtn.addEventListener('click', () => {
            audioPlayer.play().then(() => {
                welcomeScreen.style.display = 'none';
                mainContent.style.display = 'flex';
            }).catch(e => {
                alert("Tiyaking na-upload ang song.mp3 file sa GitHub repository.");
            });
        });

        // Tumpak na pagkaka-sync sa bawat titik at tono gamit ang audio timeupdate
        audioPlayer.addEventListener('timeupdate', () => {
            const currentTime = audioPlayer.currentTime;

            lyricLines.forEach(line => {
                const start = parseFloat(line.getAttribute('data-start'));
                const end = parseFloat(line.getAttribute('data-end'));
                const chars = line.querySelectorAll('.char');

                if (currentTime >= start && currentTime <= end) {
                    line.classList.add('active-line');
                    // Kwentahin kung anong porsyento na ng kanta sa loob ng linyang ito ang natapos
                    const progress = (currentTime - start) / (end - start);
                    const activeCount = Math.floor(progress * chars.length);

                    chars.forEach((char, index) => {
                        if (index <= activeCount) {
                            char.classList.add('highlighted');
                        } else {
                            char.classList.remove('highlighted');
                        }
                    });
                } else if (currentTime > end) {
                    line.classList.remove('active-line');
                    // Kapag tapos na ang linyang ito, panatilihing kulay red para sa ganda
                    chars.forEach(char => char.classList.add('highlighted'));
                } else {
                    line.classList.remove('active-line');
                    chars.forEach(char => char.classList.remove('highlighted'));
                }
            });
        });
    </script>
</body>
</html>
