<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        .header {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 20px;
        }
        
        /* Welcome Screen (Unang makikita) */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 20px;
        }
        .apology-text {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .click-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 30px;
            border-radius: 30px;
            color: #fff;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .click-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        /* Main Lyrics Screen (Naka-hide muna) */
        .main-content {
            flex: 1;
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            max-width: 600px;
            position: relative;
            width: 100%;
        }
        .chorus-line {
            font-size: 24px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            position: absolute;
            width: 80%;
        }
        .chorus-line.active {
            opacity: 1;
            transform: translateY(0);
        }
        .footer {
            text-align: center;
            padding-bottom: 15px;
        }
        .status {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">PAMBAWI LANGG</div>
    
    <!-- Unang screen pagka-open ng link -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="apology-text">Sorry na, Maee</div>
        <button class="click-btn" id="clickItBtn">Click it</button>
    </div>

    <!-- Screen kung saan tutugtog ang kanta at aandar ang lyrics -->
    <div class="main-content" id="mainContent">
        <div class="chorus-line active">And the light disappears</div>
        <div class="chorus-line">You'll be safe here</div>
        <div class="chorus-line">When nobody is here screaming</div>
        <div class="chorus-line">I'll scream with you</div>
    </div>

    <div class="footer">
        <div class="status" id="audioStatus">You'll be Safe Here - Adie</div>
    </div>

    <audio id="audioPlayer" src="song.mp3" loop></audio>

    <script>
        const clickItBtn = document.getElementById('clickItBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const mainContent = document.getElementById('mainContent');
        const audioPlayer = document.getElementById('audioPlayer');
        const lines = document.querySelectorAll('.chorus-line');
        let currentIndex = 0;

        clickItBtn.addEventListener('click', () => {
            audioPlayer.play().then(() => {
                // Itago ang welcome screen, ipakita ang lyrics
                welcomeScreen.style.display = 'none';
                mainContent.style.display = 'flex';
                
                // Simulan ang animation ng pagpapalit ng linya bawat 3.5 segundo
                setInterval(showNextLine, 3500);
            }).catch(e => {
                alert("Tiyaking na-upload ang song.mp3 file sa GitHub repository.");
            });
        });

        function showNextLine() {
            lines[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % lines.length;
            lines[currentIndex].classList.add('active');
        }
    </script>
</body>
</html>
